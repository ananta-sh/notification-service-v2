spring:
  profiles:
    default: local
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.notificationservice.*"
        spring.json.value.default.type: "com.notificationservice.entity.NotificationEvent"

# ── Kafka topic names ──────────────────────────────────────────────────────
kafka:
  topics:
    email: notification.email
    sms: notification.sms
    push: notification.push
    dlq: notification.dlq
  consumer:
    retry:
      max-attempts: 2
      backoff-ms: 2000

# ── Mock delivery simulation ───────────────────────────────────────────────
mock:
  delivery:
    failure-rate: 0.30

# ── FEATURE: Rate limiting per channel ────────────────────────────────────
rate-limit:
  email: 10.0     # 10 permits/sec  (SMTP provider constraint)
  sms: 50.0       # 50 permits/sec  (Twilio/carrier constraint)
  push: 100.0     # 100 permits/sec (FCM/APNs are fast)

# ── FEATURE: Outbox poller interval ───────────────────────────────────────
outbox:
  poll:
    interval-ms: 2000   # poll every 2 seconds for unpublished outbox events
    batch-size: 100
  claim:
    lease-ms: 300000

# ── Actuator: expose all endpoints ────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: notification-service

# ── Swagger ───────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.notificationservice: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
