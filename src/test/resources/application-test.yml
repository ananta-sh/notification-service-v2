spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: false

mock:
  delivery:
    failure-rate: 0.0   # no failures in tests

outbox:
  poll:
    enabled: false

logging:
  level:
    root: ERROR
    com.notificationservice: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
